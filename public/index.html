<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketServer</title>
</head>
<body>
    <h1>Acceso denegado</h1>
    
    <!-- Loads the socket.io library: -->
    <script src="socket.io/socket.io.js"></script>  ///Loads the socket.io library:

    <script>
        // Connects to the server:
        var socket = io();

        socket.on('connect',function(){
            console.log('Conectado al servidor')
        });

        socket.on('disconnect',function(){
            console.log('Perdimos comunicacion con el servidor')
        });
        
        /// Sends a message: socket.emit('mensaje', {...})
        socket.emit('message',{nombre:'Sergio'})   

        ///Listens for messages:
        socket.on('message',function (payload) {     
            console.log('Escuchando:',payload)
        });


    </script>
</body>
</html>
